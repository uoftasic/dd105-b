# Quarto build of the DD105-B docs (replacing Docsify's index.html,
# _sidebar.md and _navbar.md).
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page.

project:
  type: website
  output-dir: _site
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false

website:
  title: "DD105-B — Testbenches with UVM"
  description: "Build a UVM testbench in Python, with pyuvm and cocotb on Verilator, for the same packet router as DD105-A."
  site-url: https://uoftasic.com/dd105-b/
  repo-url: https://github.com/uoftasic/dd105-b
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "← All courses"
        href: https://edu.uoftasic.com/
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Labs"
        href: labs/lab-01-one-alu-two-frameworks-overview.md
    right:
      - text: Course PDF
        icon: file-pdf
        href: "dd105-b-course.pdf"
      - icon: github
        href: https://github.com/uoftasic/dd105-b
        aria-label: GitHub
  sidebar:
    # From 992px up, floating sets the sidebar 1.5em in from the left edge
    # of the window, as "On this page" is from the right. Docked puts the
    # sidebar against the left edge.
    style: floating
    contents:
      - text: "Home"
        href: index.md
      - section: "1. Two frameworks"
        contents:
          - text: "Getting started"
            href: guide/getting-started.md
          - text: "What a framework buys you"
            href: guide/what-a-framework-buys-you.md
          - text: "From cocotb tests to pyuvm components"
            href: guide/from-cocotb-tests-to-pyuvm-components.md
          - text: "Lab 01: One ALU, two frameworks"
            href: labs/lab-01-one-alu-two-frameworks-overview.md
      - section: "2. A layered testbench"
        contents:
          - text: "Python classes and cocotb concurrency"
            href: guide/python-classes-and-cocotb-concurrency.md
          - text: "Driving and sampling on the clock"
            href: guide/driving-and-sampling-on-the-clock.md
          - text: "Lab 02: A layered testbench without pyuvm"
            href: labs/lab-02-a-layered-testbench-without-pyuvm-overview.md
      - section: "3. Constraints and coverage"
        contents:
          - text: "Constrained random with pyvsc"
            href: guide/constrained-random-with-pyvsc.md
          - text: "Functional coverage you can read"
            href: guide/functional-coverage-you-can-read.md
          - text: "Lab 03: Constraints and coverage"
            href: labs/lab-03-constraints-and-coverage-overview.md
      - section: "4. pyuvm"
        contents:
          - text: "The pyuvm skeleton"
            href: guide/the-pyuvm-skeleton.md
          - text: "Sequences, sequencers and drivers"
            href: guide/sequences-sequencers-and-drivers.md
          - text: "Monitors, analysis ports and scoreboards"
            href: guide/monitors-analysis-ports-and-scoreboards.md
          - text: "The factory and ConfigDB"
            href: guide/the-factory-and-configdb.md
          - text: "Lab 04: The same testbench in pyuvm"
            href: labs/lab-04-the-same-testbench-in-pyuvm-overview.md
      - section: "5. Protocol rules"
        contents:
          - text: "Assertions for interface rules"
            href: guide/assertions-for-interface-rules.md
          - text: "Reactive agents and backpressure"
            href: guide/reactive-agents-and-backpressure.md
          - text: "Virtual sequences"
            href: guide/virtual-sequences.md
          - text: "Lab 05: Protocol rules and backpressure"
            href: labs/lab-05-protocol-rules-and-backpressure-overview.md
      - section: "6. Registers"
        contents:
          - text: "Register models in pyuvm"
            href: guide/register-models-in-pyuvm.md
          - text: "Regressions and seeds"
            href: guide/regressions-and-seeds.md
          - text: "Lab 06: The register block"
            href: labs/lab-06-the-register-block-overview.md
      - section: "7. Capstone"
        contents:
          - text: "Verification plans and sign-off"
            href: guide/verification-plans-and-sign-off.md
          - text: "Writing the verification report"
            href: guide/writing-the-verification-report.md
          - text: "Lab 07: Capstone"
            href: labs/lab-07-capstone-overview.md
      - section: "Reference"
        contents:
          - text: "The router in one page"
            href: reference/the-router-in-one-page.md
          - text: "The packet router"
            href: reference/router-spec.md
          - text: "The pyuvm register API"
            href: reference/pyuvm-register-api.md
          - text: "Getting the tools outside the course image"
            href: reference/getting-the-tools-outside-the-course-image.md
      - section: "Repo"
        contents:
          - text: "Lab packages"
            href: https://github.com/uoftasic/dd105-b/tree/main/labs
          - text: "The shared build and graders"
            href: https://github.com/uoftasic/dd105-b/tree/main/labs/common
          - text: "The reference testbench"
            href: https://github.com/uoftasic/dd105-b/tree/main/labs/ref

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    # sidebar-width and margin-width are the widths of the sidebar and of
    # "On this page". The text column gets most of the width those two
    # leave, so it grows with the window. Quarto caps it at body-width minus
    # 3em, and body-width is set far wider than any screen. To set a
    # narrower cap, lower body-width.
    grid:
      sidebar-width: 200px
      margin-width: 200px
      body-width: 10000px
    # Keeps old Docsify links (.../dd105-b/#/labs/...) working.
    include-in-header: _docsify-redirect.html
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
